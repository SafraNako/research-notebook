[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-notebook"
version = "0.1.0"
description = "A local-first literature tracker and research notebook: saved searches over arXiv, PubMed and OpenAlex that surface only unseen papers, one library with reading states, tags, Markdown notes, full-text search, BibTeX in and out and a weekly digest; cross-source duplicate resolution validated against a planted-truth world and real recorded data"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "SafraNako" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[project.scripts]
arastirma = "arastirma_defteri.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arastirma_defteri = ["data/*.json.gz"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
